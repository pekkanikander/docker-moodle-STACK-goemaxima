id: fixture-matka-choice
name: "Fixture: kuljettu matka vai välimatka (valitaan tulkinta)"
category: [Testi, Tulkinta]
tags: [fixture, tulkinta, scaffold-choice]
scaffold: choice

seeds: [401, 402, 403]

variables: |
  k  : rand([1, 2, 3]);
  sx : 300 * k;
  sy : 400 * k;

stem: |
  Oppilas kävelee ensin {@sx@} metriä itään ja kääntyy sitten pohjoiseen,
  jonne hän kävelee {@sy@} metriä. Tehtävässä kysytään kuljettua matkaa.

interpretation:
  weight: 0.4
  prompt: |
    Fysiikassa nopeus v määritellään kaavalla v = s / t, jossa s on matka.
    Mitä sanalla <em>matka</em> tarkoitetaan tässä tehtävässä?
  readings:
    - key: reitti
      label: "matka on kuljetun reitin pituus"
      value: sx + sy
      intended: true
      why: "Aivan: matka mitataan kuljettua reittiä pitkin, joten molemmat osuudet lasketaan yhteen."
    - key: valimatka
      label: "matka on etäisyys lähtöpisteestä"
      value: sqrt(sx^2 + sy^2)
      why: "Etäisyyttä lähtöpisteestä sanotaan välimatkaksi tai siirtymäksi. Tässä tehtävässä matka mitataan kuljettua reittiä pitkin."

answer:
  type: numerical
  quantity: s
  formula: s
  prompt: "Laske matka valitsemasi tulkinnan mukaan. Vastaa metreinä."
  boxsize: 8

feedback: |
  <em>Kuljettu matka</em> on {@sx@} m + {@sy@} m = {@sx + sy@} m.
  Lähtö- ja loppupisteen <em>välimatka</em> (eli siirtymä) on {@sqrt(sx^2 + sy^2)@} m.
  Kysymyksenasettelusta riippuen sana <em>matka</em> voi tarkoittaa kumpaa tahansa.
  Merkitys pitää päätellä siitä, miten kysymys on asetettu.
