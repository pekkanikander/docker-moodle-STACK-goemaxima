id: fixture-matka-stated
name: "Fixture: kuljettu matka vai välimatka (tulkinta annettu)"
category: [Testi, Tulkinta]
tags: [fixture, tulkinta, scaffold-stated]
scaffold: stated

seeds: [301, 302, 303]

variables: |
  k  : rand([1, 2, 3]);
  sx : 300 * k;
  sy : 400 * k;

stem: |
  Oppilas kävelee ensin {@sx@} metriä itään ja kääntyy sitten pohjoiseen,
  jonne hän kävelee {@sy@} metriä.

interpretation:
  stated_prefix: "Tässä tehtävässä käytetään tulkintaa:"
  readings:
    - key: reitti
      label: "matka on kuljetun reitin pituus"
      value: sx + sy
      intended: true
      why: "Matka mitataan kuljettua reittiä pitkin: {@sx@} m + {@sy@} m = {@sx + sy@} m."
    - key: valimatka
      label: "matka on etäisyys lähtöpisteestä"
      value: sqrt(sx^2 + sy^2)
      why: "Tämä on välimatka (eli siirtymä) lähtöpisteestä, {@sqrt(sx^2 + sy^2)@} m. Tässä kysymyksessä sana <em>matka</em> tarkoittaa kuljettua reittiä. Tämän voi päätellä siitä, että kysymyksessä kuvataan reitin kulku."

answer:
  type: numerical
  quantity: s
  formula: s
  prompt: "Kuinka pitkän matkan oppilas kulkee? Vastaa metreinä."
  boxsize: 8

feedback: |
  Reitti koostuu kahdesta osasta, joten kuljettu matka on
  {@sx@} m + {@sy@} m = {@sx + sy@} m.

  Etäisyys lähtöpisteestä (eli siirtymä) olisi {@sqrt(sx^2 + sy^2)@} m.
  Koska tässä tehtävässä itse kysymyksenasettelussa kerrotaan,
  mitä <em>reittiä</em> oppilas kulkee, tästä voidaan päätellä,
  että tässä tehtävässä sana <em>matka</em> tarkoittaa kuljetun reitin pituutta,
  ei lähtöpisteen ja loppupisteen välimatkaa.
