id: fixture-nopeus-vapaa-yksikko
name: "Fixture: nopeus vapaassa yksikössä"
category: [Testi, Perusteet]
tags: [fixture, yksikot]

seeds: [211, 212, 213]

variables: |
  sx   : rand([18, 36, 54]);
  aika : 2;

stem: |
  Pyöräilijä etenee {@sx@} km ajassa {@aika@} h.

# strict: false, so any compatible unit earns full marks; the prompt
# accordingly leaves the choice of unit to the student.
answer:
  type: units
  strict: false
  prompt: "Laske pyöräilijän keskinopeus. Saat valita yksikön itse."
  formula: sx/aika * km/h

feedback: |
  Keskinopeus on matka jaettuna ajalla:
  \({@sx@}\,\mathrm{km} / {@aika@}\,\mathrm{h} = {@sx/aika@}\,\mathrm{km/h}\).
