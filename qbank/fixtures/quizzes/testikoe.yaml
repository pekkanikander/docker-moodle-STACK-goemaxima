id: fixture-testikoe
name: "Fixture: koejärjestelmän testi"
intro: |
  Tämä koe on testiaineistoa, ei oikeaa harjoitusmateriaalia. Se käy läpi
  kaikki tuetut tehtävätyypit: satunnaistetut muuttujat, numeerinen,
  algebrallinen ja yksiköllinen vastaus, tulkintatuen kolme tasoa, CAS:n
  piirtämät ja valmiit kuvat sekä AI-arvioitu selitystehtävä.

behaviour: adaptive
questionsperpage: 1
attempts: 0
grademethod: highest

questions:
  - id: fixture-summa
  - id: fixture-liike-energia
  - id: fixture-tiheys
  - id: fixture-nopeus-vapaa-yksikko
  - id: fixture-matka-stated
  - id: fixture-matka-choice
    maxmark: 2
  - id: fixture-matka-none
  - id: fixture-matkakuvaaja-stated
  - id: fixture-virtapiiri-choice
    maxmark: 2
  - id: fixture-nopeuskuvaaja-none
  - id: fixture-selitys-kelluminen
    maxmark: 5
