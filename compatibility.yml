# Supported tuples and compatibility notes.
# - Pin tags to avoid surprise upgrades.
# - Bump one axis at a time (Moodle, STACK, DB).
# - STACK must match goemaxima mapping; update both together.

tuples:
  - id: "moodle51-stack4130-maxima2026062900-1.2.0"
    moodle:
      line: "5.1"
      release: "5.1.6"
      php_base: "php:8.3-apache"
    mariadb: "mariadb:11.4"
    stack:
      version: "4.13.0"
      plugin_version: "2026062900"
      source: "github-tag"
      companion_plugins:
        - "qbehaviour_dfexplicitvaildate"
        - "qbehaviour_dfcbmexplicitvaildate"
        - "qbehaviour_adaptivemultipart"
        - "qbank_importasversion"
    goemaxima:
      image: "mathinstitut/goemaxima:2026062900-1.2.0"
      endpoint: "http://maxima:8080/goemaxima"
    qbank_tools:
      base_image: "python:3.13-slim"
      pyyaml: "6.0.2"
    mailpit: "axllent/mailpit:v1.31.0"
    ai_provider:
      plugin: "aiprovider_claude"
      version: "1.0.4"
      source: "github-tag"
      # version.php: requires Moodle 5.0 (2025041400), supported [500, 502].
    aitext:
      plugin: "qtype_aitext_rubric"
      version: "0.1.0"
      source: "github-tag"
      # Our fork of qtype_aitext 2.1.0 (requires Moodle 4.5, 2024100700);
      # the behaviour adapters are our forks too (upstream ties them to
      # qtype_aitext), pinned by commit SHA — untagged as of 2026-08-28.
      companion_plugins:
        - "qbehaviour_deferred_for_aitext"
        - "qbehaviour_immediate_for_aitext"
        - "local_aitextflags"

notes:
  - "Moodle code tree read-only is a goal; validate before enforcing."
  - "MariaDB and goemaxima are internal-only (no host ports)."
  - "STACK source is pinned to a GitHub tag archive; behaviour plugin checksums are recorded in versions.yml."
  - "Compiled questions record stack_maxima_version in <stackversion>; it must match the STACK plugin version above."
  - "oivus.pnr.iki.fi verified on this tuple 2026-08-19: qtype_stack version 2026062900, goemaxima 2026062900-1.2.0."
