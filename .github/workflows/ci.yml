name: CI

on:
  push:
    tags: ["*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure yq is available
        run: |
          if command -v yq >/dev/null 2>&1; then
            yq --version
            exit 0
          fi
          YQ_VERSION="v4.50.1"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) yq_arch="amd64" ;;
            aarch64|arm64) yq_arch="arm64" ;;
            *)
              echo "Unsupported architecture: ${arch}" >&2
              exit 1
              ;;
          esac
          url="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${yq_arch}"
          tmp="$(mktemp)"
          curl -fsSL "$url" -o "$tmp"
          if command -v sudo >/dev/null 2>&1; then
            sudo install -m 0755 "$tmp" /usr/local/bin/yq
          else
            install -m 0755 "$tmp" /usr/local/bin/yq
          fi
          rm -f "$tmp"
          yq --version

      - name: Ensure envsubst is available
        run: |
          if ! command -v envsubst >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends gettext-base
            else
              apt-get update
              apt-get install -y --no-install-recommends gettext-base
            fi
          fi
          envsubst --version | head -n 1

      - name: Infra script tests
        run: ./infra/hetzner/tests/run-tests.sh

      - name: Check committed .env.versions freshness
        run: |
          set -eu
          ./tools/update-versions.sh /tmp/env.versions.fresh
          diff -u .env.versions /tmp/env.versions.fresh

      - name: Prepare env
        run: |
          set -eu
          if [ ! -f .env.ci ]; then
            # The absolute default persistent root would be created root-owned by
            # Docker; clean-rebuild.sh only wipes and opens up relative roots.
            printf '%s\n' \
              'MOODLE_PERSISTENT_ROOT=.ci-persistent' \
              'MOODLE_ADMIN_PASSWORD=testing-only-no-production' \
              > .env.ci
          fi
          cat .env.versions .env.example .env.ci > .env

      - name: Clean rebuild
        run: ./tools/clean-rebuild.sh

      - name: Smoke tests
        run: ./init/scripts/smoke-tests.sh

      - name: Question bank fixtures
        run: ./tools/qbank.sh all

      - name: First-run path (tools/start.sh)
        run: |
          set -eu
          docker compose --env-file .env.versions --env-file .env down -v
          rm -f .env
          rm -rf .persistent
          ./tools/start.sh
          ./init/scripts/smoke-tests.sh
          # Second run must detect the installed site and stay idempotent.
          ./tools/start.sh
          ./init/scripts/smoke-tests.sh

      # Only .env.versions here: .env may be absent or replaced by this point,
      # and it only carries optional overrides with compose-level defaults.
      - name: Logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.versions ps
          docker compose --env-file .env.versions logs --no-color

      - name: Teardown
        if: always()
        run: docker compose --env-file .env.versions down
