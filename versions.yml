# The behaviour plugins below are pinned at their 2022-09-22 releases, whose
# plugins-directory metadata declares support only up to Moodle 4.5. That
# metadata is informational; Moodle enforces each plugin's own version.php,
# and STACK upstream is tested on current Moodle lines with exactly these
# releases. Keep the pins until upstream tags newer ones.
