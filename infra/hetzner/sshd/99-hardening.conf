# Installed by infra/hetzner/scripts/server-bootstrap.sh; do not edit on the VM.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
UsePAM yes
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20

# When Ubuntu ships OpenSSH >= 9.8, add PerSourcePenalties here (built-in
# auth-failure throttling, the fail2ban replacement; see ROADMAP.md).
